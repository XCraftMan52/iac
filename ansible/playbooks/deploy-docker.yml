---
- name: Deploy Docker Service
  hosts: "{{ target_host }}"
  become: true

  vars:
    service_path: "/opt/iac/docker/{{ service }}"
    infisical_path: "/{{ service }}"
    env_backups_to_keep: 3
    # Credentials come from the runner's environment (lookups run on the
    # controller), so they never appear on the ansible-playbook command line.
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    infisical_client_id: "{{ lookup('env', 'INFISICAL_CLIENT_ID') }}"
    infisical_client_secret: "{{ lookup('env', 'INFISICAL_CLIENT_SECRET') }}"
    infisical_project_id: "{{ lookup('env', 'INFISICAL_PROJECT_ID') }}"

  tasks:
    - name: Login to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
      no_log: true

    - name: Update repository
      ansible.builtin.git:
        repo: git@github.com:XCraftMan52/iac.git
        dest: /opt/iac
        version: main
        update: true
        key_file: /home/xcraftman52/.ssh/github_iac

    - name: Login to Infisical
      ansible.builtin.command:
        cmd: >
          infisical login
          --method=universal-auth
          --client-id={{ infisical_client_id }}
          --client-secret={{ infisical_client_secret }}
          --silent
          --plain
      environment:
        INFISICAL_API_URL: "https://infisical.lucaswebber.dev"
      delegate_to: localhost
      register: infisical_login
      no_log: true

    - name: Generate .env from Infisical
      ansible.builtin.command:
        cmd: >
          infisical export
          --projectId={{ infisical_project_id }}
          --env=prod
          --path={{ infisical_path }}
          --format=dotenv
      environment:
        INFISICAL_API_URL: "https://infisical.lucaswebber.dev"
        INFISICAL_TOKEN: "{{ infisical_login.stdout }}"
      delegate_to: localhost
      register: infisical_env
      changed_when: false
      failed_when: >
        infisical_env.rc != 0 and
        "Folder with path" not in infisical_env.stderr
      no_log: true

    - name: Check for existing .env
      ansible.builtin.stat:
        path: "{{ service_path }}/.env"
      register: env_file

    - name: Back up existing .env
      ansible.builtin.copy:
        src: "{{ service_path }}/.env"
        dest: "{{ service_path }}/.env.bak.{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when:
        - env_file.stat.exists
        - infisical_env.stdout | trim | length > 0

    - name: Write .env
      ansible.builtin.copy:
        dest: "{{ service_path }}/.env"
        content: |
          # ============================================================
          # AUTO-GENERATED BY INFISICAL / CI/CD
          # DO NOT EDIT MANUALLY
          # Source: Infisical {{ infisical_path }}
          # ============================================================

          {{ infisical_env.stdout }}
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when:
        - infisical_env.stdout | trim | length > 0
      no_log: true

    - name: Find old .env backups
      ansible.builtin.find:
        paths: "{{ service_path }}"
        patterns: ".env.bak.*"
        hidden: true
      register: env_backups

    - name: Keep only the newest {{ env_backups_to_keep }} .env backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (env_backups.files | sort(attribute='mtime', reverse=true))[env_backups_to_keep:] }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Restart Docker Compose service
      community.docker.docker_compose_v2:
        project_src: "{{ service_path }}"
        pull: always
        state: present
        remove_orphans: true