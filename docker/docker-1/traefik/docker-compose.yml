services:
  traefik:
    security_opt:
      - no-new-privileges:true
    restart: always    
    container_name: "traefik"
    image: "traefik:v3.7.11"
    command: # CLI arguments
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=true

      - --entryPoints.http.address=:80
      - --entryPoints.http.http.redirections.entryPoint.to=https
      - --entryPoints.http.http.redirections.entryPoint.scheme=https
      - --entryPoints.http.http.redirections.entryPoint.permanent=true
      - --entryPoints.https.address=:443
      - --entrypoints.https.http.tls.certresolver=dns-cloudflare
      - '--entrypoints.https.transport.respondingtimeouts.idletimeout=600s'
      - '--entrypoints.https.transport.respondingtimeouts.readtimeout=600s'
      - '--entrypoints.https.transport.respondingtimeouts.writetimeout=600s'

      - --api=true
      - --api.insecure=true
      - --api.dashboard=true
      - --log=true
      #- --log.filePath=/logs/traefik.log
      - --log.level=INFO # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC
      - --accessLog=true
      #- --accessLog.filePath=/logs/access.log
      - --accessLog.bufferingSize=100 # Configuring a buffer of 100 lines
      - --accessLog.filters.statusCodes=204-299,400-499,500-599
      - --providers.docker=true
      - --serversTransport.insecureSkipVerify=true
      # - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.endpoint=unix:///var/run/docker.sock # Use Docker Socket Proxy instead for improved security
      - --providers.docker.watch=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/rules # Load dynamic configuration from one or more .toml or .yml files in a directory
      - --providers.file.watch=true # Only works on top level files in the rules folder
      - "--certificatesResolvers.dns-cloudflare.acme.email=${CLOUDFLARE_API_EMAIL}"
      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.delayBeforeCheck=90 # To delay DNS check and reduce LE hitrate
    networks:
      - proxy
      # - socket_proxy
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
     # - ./data/rules:/rules # file provider directory
      - /opt/appdata/traefik/acme.json:/acme.json # Cert Location
     # - ./data/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ../.env
      - TRAEFIK_DOMAIN_NAME
      - CF_API_EMAIL=$CLOUDFLARE_API_EMAIL
      - CF_API_KEY=$CLOUDFLARE_API_KEY
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entryPoints=https"
      - "traefik.http.routers.api.rule=Host(`$TRAEFIK_DOMAIN_NAME`)"
      - "traefik.http.routers.api.service=api@internal"

      # =========================
      # Proxmox - Adams
      # =========================

      # Router
      - "traefik.http.routers.pve-adams.rule=Host(`$PVE_DOMAIN_NAME`)"
      - "traefik.http.routers.pve-adams.entrypoints=websecure"
      - "traefik.http.routers.pve-adams.tls=true"

      # Service
      - "traefik.http.services.pve-adams.loadbalancer.server.url=https://10.32.100.20:8006"
      - "traefik.http.services.pve-adams.loadbalancer.serversTransport=pve-adams"

      # Proxmox self-signed certificate
      - "traefik.http.serversTransports.pve-adams.insecureSkipVerify=true"

       # Middleware: HTTP -> HTTPS
      - "traefik.http.middlewares.middlewares-https-redirectscheme.redirectscheme.scheme=https"
      - "traefik.http.middlewares.middlewares-https-redirectscheme.redirectscheme.permanent=true"

      # Middleware: non-www -> www
      - "traefik.http.middlewares.redirect-non-www-to-www.redirectregex.permanent=true"
      - "traefik.http.middlewares.redirect-non-www-to-www.redirectregex.regex=^https?://(?:www\\.)?(.+)"
      - "traefik.http.middlewares.redirect-non-www-to-www.redirectregex.replacement=https://www.$${1}"

      # Middleware: www -> non-www
      - "traefik.http.middlewares.redirect-www-to-non-www.redirectregex.permanent=true"
      - "traefik.http.middlewares.redirect-www-to-non-www.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.redirect-www-to-non-www.redirectregex.replacement=https://$${1}"

networks:
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
#   socket_proxy:
#     external: true