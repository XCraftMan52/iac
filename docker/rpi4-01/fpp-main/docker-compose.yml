services:
  fpp-main:
    image: falconchristmas/fpp:10.3@sha256:c613cb2e033448d94c2b5c5cf92754937cce65f61b9e41cb0ced5e1c8b02395b
    container_name: fpp-main
    hostname: fpp-main # reported to other players via MultiSync
    restart: always
    # macvlan on VLAN 80 gives FPP its own IP (10.32.80.10) so MultiSync broadcast,
    # E1.31 multicast and DDP work without port mapping. Web UI is on :80 of that IP.
    networks:
      fpp:
        ipv4_address: 10.32.80.10
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    cap_add:
      - SYS_PTRACE
      - SYS_NICE
      - NET_ADMIN
    security_opt:
      - no-new-privileges:false
      - systempaths=unconfined
    devices:
      - /dev/snd:/dev/snd # all sound cards on the Pi
    volumes:
      # Must be owned by 500:500 (fpp user inside the container)
      - /opt/appdata/fpp-main/media:/home/fpp/media
    environment:
      - FPP_DOCKER_IP=10.32.80.10
      - TZ=America/New_York
    user: "0:0"
    entrypoint: >
      /bin/bash -c "
      rm -f /var/run/dbus/pid /var/run/avahi-daemon/pid /run/dbus/pid /run/dbus/system_bus_socket &&
      mkdir -p /run/dbus &&
      dbus-daemon --system --fork &&
      avahi-daemon --daemonize &&
      exec /opt/fpp/Docker/runDocker.sh
      "
networks:
  fpp:
    driver: macvlan
    driver_opts:
      parent: eth0.80
    ipam:
      config:
        - subnet: 10.32.80.0/24
          gateway: 10.32.80.1
          ip_range: 10.32.80.10/32