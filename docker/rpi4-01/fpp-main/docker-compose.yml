services:
  fpp-main:
    image: falconchristmas/fpp:10.3@sha256:c613cb2e033448d94c2b5c5cf92754937cce65f61b9e41cb0ced5e1c8b02395b
    container_name: fpp-main
    hostname: fpp-main # reported to other players via MultiSync
    restart: always
    # macvlan on VLAN 80 gives FPP its own IP (10.32.80.10) so MultiSync broadcast,
    # E1.31 multicast and DDP work without port mapping. Web UI is on :80 of that IP.
    networks:
      fpp:
        ipv4_address: 10.32.80.10
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    cap_add:
      - SYS_PTRACE
      - SYS_NICE
      - NET_ADMIN
    security_opt:
      - no-new-privileges:false
      - systempaths=unconfined
    devices:
      - /dev/snd:/dev/snd # all sound cards on the Pi (USB Sound Blaster Play! 3 = card "S3")
    volumes:
      # Must be owned by 500:500 (fpp user inside the container)
      - /opt/appdata/fpp-main/media:/home/fpp/media
      - ./entrypoint.sh:/usr/local/bin/fpp-docker-entrypoint.sh:ro
    environment:
      - FPP_DOCKER_IP=10.32.80.10
      - TZ=America/New_York
      # Where FPP's PipeWire lives (mirrors etc/systemd/fpp-pipewire*.service) so
      # fppd and every other client in the container can find the server.
      - PIPEWIRE_RUNTIME_DIR=/run/pipewire-fpp
      - XDG_RUNTIME_DIR=/run/pipewire-fpp
      - PIPEWIRE_CONFIG_DIR=/etc/pipewire
      - PULSE_RUNTIME_PATH=/run/pipewire-fpp/pulse
    user: "0:0"
    # Starts D-Bus/Avahi and FPP's PipeWire stack (no systemd in the container),
    # then hands off to FPP's own runDocker.sh. See entrypoint.sh.
    entrypoint: ["/bin/bash", "/usr/local/bin/fpp-docker-entrypoint.sh"]
networks:
  fpp:
    driver: macvlan
    driver_opts:
      parent: eth0.80
    ipam:
      config:
        - subnet: 10.32.80.0/24
          gateway: 10.32.80.1
          ip_range: 10.32.80.10/32