---
services:
  loki:
    container_name: loki
    image: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: "-config.file=/etc/loki/config.yaml"
    # ports:
    #   - "3100:3100"
    volumes:
      - ./config/config.yaml:/etc/loki/config.yaml:ro
      - /opt/appdata/loki:/loki:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`$LOKI_DOMAIN`)"
      - "traefik.http.routers.loki.entrypoints=https"
      - "traefik.http.routers.loki.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
    networks:
      - proxy
      - grafana
    restart: unless-stopped


networks:
  proxy:
    external: true
  grafana:
    external: true
