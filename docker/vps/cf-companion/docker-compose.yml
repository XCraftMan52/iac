services:
  cf-companion:
      container_name: cf-companion
      image: ghcr.io/tiredofit/docker-traefik-cloudflare-companion:latest@sha256:c6a6ed120d44af7d0d7e4f961894fa40c36b33f90dc2d453a2a6005ff81bf7c7
      restart: always
      security_opt:
        - no-new-privileges:true
      env_file: .env
      environment:
        - DOCKER_HOST=tcp://socket-proxy:2375 # read-only Docker API, see socket-proxy
      networks:
        - default      # outbound to the Cloudflare API
        - socket_proxy
      # labels:
      #   # Add hosts specified in rules here to force cf-companion to create the CNAMEs
      #   # Since cf-companion creates CNAMEs based on host rules, this a workaround for non-docker/external apps
      #   - "traefik.http.routers.cf-companion-rtr.rule=HostHeader(`pihole.$DOMAINNAME_HOME_SERVER`) || HostHeader(`hassio.$DOMAINNAME_HOME_SERVER`)"

networks:
  socket_proxy:
    external: true
