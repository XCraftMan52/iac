services:
  mwebber-blog:
    image: ghcr.io/vid131/hugo-blog:latest@sha256:55d1391f4ca604c3e7083357e266635d3109b863d0db7d21ff0b8ac91b6d9750
    container_name: mwebber-blog
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mwebber.rule=Host(`$MWEBBER_DOMAIN_NAME`)"
      - "traefik.http.routers.mwebber.entrypoints=https"
      - "traefik.http.routers.mwebber.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.mwebber.loadBalancer.server.port=80"

networks:
  proxy:
    external: true