services:
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - internal
    volumes:
      - /opt/appdata/vaultwarden:/data
    env_file:
      - .env
    depends_on:
      - mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.entrypoints=https"
      - "traefik.http.routers.vaultwarden.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.rule=Host(`$VAULT_DOMAIN_NAME`)"

  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: vaultwarden-mysql
    restart: always
    networks:
      - internal
    env_file: 
      - .env
    volumes:
      - /opt/appdata/vaultwarden-db:/var/lib/mysql

networks:
  proxy:
    external: true
  internal:
    internal: true
