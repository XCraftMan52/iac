services:
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    restart: unless-stopped
    user: "1000"
    networks:
      - proxy
      - grafana
    environment:
      - GF_SERVER_ROOT_URL=https://$GRAFANA_DOMAIN
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel
      - GF_DATABASE_TYPE
      - GF_DATABASE_HOST
      - GF_DATABASE_NAME
      - GF_DATABASE_USER
      - GF_DATABASE_PASSWORD
      - GF_DATABASE_SSL_MODE
    volumes:
      - '/opt/appdata/grafana:/var/lib/grafana'
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`$GRAFANA_DOMAIN`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
  postgres:
    container_name: grafana-postgres
    image: postgres:15@sha256:5a407822929c3789ff5154d3d35bd7e2090318149344c8a3d4ca942b035822ed
    restart: always
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    ports:
      - "5432"
    networks:
      - grafana
    volumes:
      - /opt/appdata/grafana-db:/var/lib/postgresql/data
    
networks:
  grafana:
    name: grafana
  proxy:
    external: true