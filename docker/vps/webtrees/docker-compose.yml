services:
  webtrees:
    container_name: webtrees
    image: nathanvaughn/webtrees:2.2.6@sha256:27597e9f4664b69380a61d56188f8acdf5fcda31ba9a59187d048c2ac8ee57b8
    networks:
      - proxy
      - webtrees
    restart: unless-stopped
    volumes:
      - /opt/appdata/webtrees/data:/var/www/webtrees/data/
      - /opt/appdata/webtrees/media:/var/www/webtrees/media/
      - /opt/appdata/webtrees/modules_v4:/var/www/webtrees/modules_v4/
    environment:
      - DB_TYPE
      - DB_HOST
      - DB_USER
      - DB_NAME
      - DB_PASS
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webtrees.rule=Host(`$WEBTREES_DOMAIN`)"
      - "traefik.http.routers.webtrees.entrypoints=https"
      - "traefik.http.routers.webtrees.tls=true"                        # ADD THIS
      - "traefik.http.routers.webtrees.tls.certresolver=dns-cloudflare"
      - "traefik.http.services.webtrees.loadbalancer.server.port=80"

  mysql:
    image: mysql:8.3@sha256:9de9d54fecee6253130e65154b930978b1fcc336bcc86dfd06e89b72a2588ebe
    container_name: webtrees-mysql
    restart: always
    networks:
      - webtrees
    env_file: 
      - .env
    volumes:
       - /opt/appdata/webtrees-db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_USER
      - MYSQL_DATABASE
      - MYSQL_PASSWORD
    # command: --default-authentication-plugin=mysql_native_password

networks:
  webtrees:
    internal: true
  proxy:
    external: true
