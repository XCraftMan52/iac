# Read-only Docker API for containers that only need to *see* containers
# (Traefik, Homepage, cf-companion). Lives on its own internal network so
# public-facing containers on `proxy` cannot reach it.
#
# Portainer, Pterodactyl Wings and the Authentik worker still mount the real
# socket: they need write access, which is root-equivalent either way.
services:
  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    networks:
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info
      # 1 = allow, 0 = deny. Only GET requests are allowed while POST=0.
      - POST=0
      - EVENTS=1     # Traefik / cf-companion watch for container changes
      - PING=1
      - VERSION=1
      - CONTAINERS=1 # Traefik, Homepage, cf-companion
      - AUTH=0
      - SECRETS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - INFO=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0

networks:
  socket_proxy:
    name: socket_proxy
    driver: bridge
    internal: true # no internet access; only containers that join can reach it
