apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: traefik
  namespace: traefik

spec:
  interval: 30m

  install:
    createNamespace: true

  chart:
    spec:
      chart: traefik
      version: ">=30.0.0"

      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system

  values:
    deployment:
      replicas: 1

    service:
      type: LoadBalancer