name: Deploy Docker Services

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service:
        description: "Docker service folder to deploy"
        required: false
        type: string

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}

jobs:
   detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changed
        run: |
          if [ -n "${{ inputs.service }}" ]; then
            echo "Manual deployment: ${{ inputs.service }}"
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVICES=$(git diff --name-only HEAD^ HEAD \
            | grep '^docker/vps/' \
            | cut -d/ -f3 \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Changed services:"
          echo "$SERVICES"

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
   deploy:
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh xcraftman52@$VPS_HOST "hostname && whoami"

      - name: Deploy ${{ matrix.service }}
        run: |
          ansible-playbook \
            -i ansible/inventories/hosts.yml \
            ansible/playbooks/deploy-docker.yml \
            -e service=${{ matrix.service }} \
            -e ghcr_username="${{ secrets.GHCR_USERNAME }}" \
            -e ghcr_token="${{ secrets.GHCR_TOKEN }}"