name: Deploy Docker Services

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"

  workflow_dispatch:
    inputs:
      service:
        description: "Service as <host>/<service> (e.g. rpi4-01/fpp-main)"
        required: true
        type: string
      action:
        description: "deploy, or remove a service whose folder was already deleted from the repo"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - remove

permissions:
  contents: read

# One deploy run at a time; a newer push waits instead of racing on /opt/iac.
concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # needed to diff against the previous push

      - name: Detect changed services
        id: changed
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_ACTION: ${{ inputs.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_SERVICE:-}" ]; then
            if ! [[ "$INPUT_SERVICE" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]]; then
              echo "::error::Service must look like <host>/<service>, got '$INPUT_SERVICE'"
              exit 1
            fi
            CANDIDATES="$INPUT_SERVICE"
          else
            # Diff the whole push, not just its last commit. Fall back to the
            # previous commit for new branches or force-pushes.
            if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="${AFTER}^"
            fi
            # docker/<host>/<service>/<file> -> <host>/<service>
            CANDIDATES=$(git diff --name-only "$BEFORE" "$AFTER" -- docker/ \
              | awk -F/ 'NF >= 4 { print $2 "/" $3 }' | sort -u)
          fi

          # Compose project name of a deleted service: the `name:` in its last
          # compose file, or the folder name. Read from the commit before the
          # folder was deleted.
          removed_project() {
            local s=$1 rev file name
            rev=$(git rev-list -1 HEAD -- "docker/$s")
            [ -n "$rev" ] || return 1
            file=$(git ls-tree --name-only "${rev}^" "docker/$s/" \
              | grep -E '/docker-compose\.ya?ml$' | head -n1) || return 1
            name=$(git show "${rev}^:$file" | yq '.name // ""')
            echo "${name:-${s##*/}}"
          }

          # One line per job: "<action> <host>/<service> <project>"
          REMOVE=()
          DEPLOY=()
          for s in $CANDIDATES; do
            host="${s%%/*}"
            if ! yq -e ".all.hosts | has(\"$host\")" ansible/inventories/hosts.yml >/dev/null; then
              echo "Skipping $s: host '$host' is not in ansible/inventories/hosts.yml"
            elif compgen -G "docker/$s/docker-compose.y*ml" >/dev/null; then
              if [ "${INPUT_ACTION:-deploy}" = remove ]; then
                echo "::error::$s is still in the repo. Delete docker/$s and push instead."
                exit 1
              fi
              DEPLOY+=("deploy $s ${s##*/}")
            elif [ "${INPUT_ACTION:-deploy}" = deploy ] && [ -n "${INPUT_SERVICE:-}" ]; then
              echo "::error::docker/$s has no compose file. To tear it down, run with action=remove."
              exit 1
            elif project=$(removed_project "$s"); then
              REMOVE+=("remove $s $project")
            else
              echo "Skipping $s: no compose file in this or earlier commits"
            fi
          done

          # Removals first, so a deleted service frees its ports before deploys.
          JSON=$(printf '%s\n' ${REMOVE[@]+"${REMOVE[@]}"} ${DEPLOY[@]+"${DEPLOY[@]}"} \
            | jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ")
                | {action: .[0], service: .[1], project: .[2]})')

          if [ -n "${INPUT_SERVICE:-}" ] && [ "$JSON" = "[]" ]; then
            echo "::error::Nothing to do for '$INPUT_SERVICE'"
            exit 1
          fi

          echo "Jobs: $JSON"
          echo "services=$JSON" >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.action }} ${{ matrix.service }}
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-services.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Install Infisical CLI
        if: matrix.action == 'deploy'
        run: |
          set -euo pipefail

          curl -1sLf \
            'https://artifacts-cli.infisical.com/setup.deb.sh' \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y infisical

          infisical --version

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is empty; refusing to trust unknown host keys"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy ${{ matrix.service }}
        if: matrix.action == 'deploy'
        env:
          SERVICE: ${{ matrix.service }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          ansible-playbook \
            -i ansible/inventories/hosts.yml \
            ansible/playbooks/deploy-docker.yml \
            -e "target_host=${SERVICE%%/*}" \
            -e "service=$SERVICE"

      - name: Remove ${{ matrix.service }}
        if: matrix.action == 'remove'
        env:
          SERVICE: ${{ matrix.service }}
          PROJECT: ${{ matrix.project }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          ansible-playbook \
            -i ansible/inventories/hosts.yml \
            ansible/playbooks/remove-docker.yml \
            -e "target_host=${SERVICE%%/*}" \
            -e "service=$SERVICE" \
            -e "project_name=$PROJECT"
