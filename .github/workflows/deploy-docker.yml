name: Deploy Docker Services

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"

  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy, as <host>/<service> (e.g. rpi4-01/fpp-main)"
        required: true
        type: string

permissions:
  contents: read

# One deploy run at a time; a newer push waits instead of racing on /opt/iac.
concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to diff against the previous push

      - name: Detect changed services
        id: changed
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_SERVICE:-}" ]; then
            if ! [[ "$INPUT_SERVICE" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]]; then
              echo "::error::Service must look like <host>/<service>, got '$INPUT_SERVICE'"
              exit 1
            fi
            CANDIDATES="$INPUT_SERVICE"
          else
            # Diff the whole push, not just its last commit. Fall back to the
            # previous commit for new branches or force-pushes.
            if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="${AFTER}^"
            fi
            # docker/<host>/<service>/<file> -> <host>/<service>
            CANDIDATES=$(git diff --name-only "$BEFORE" "$AFTER" -- docker/ \
              | awk -F/ 'NF >= 4 { print $2 "/" $3 }' | sort -u)
          fi

          # Keep services that still exist and whose host is in the inventory.
          SERVICES=()
          for s in $CANDIDATES; do
            host="${s%%/*}"
            if ! compgen -G "docker/$s/docker-compose.y*ml" >/dev/null; then
              echo "Skipping $s: no compose file (removed?)"
            elif ! yq -e ".all.hosts | has(\"$host\")" ansible/inventories/hosts.yml >/dev/null; then
              echo "Skipping $s: host '$host' is not in ansible/inventories/hosts.yml"
            else
              SERVICES+=("$s")
            fi
          done

          if [ -n "${INPUT_SERVICE:-}" ] && [ ${#SERVICES[@]} -eq 0 ]; then
            echo "::error::Nothing to deploy for '$INPUT_SERVICE'"
            exit 1
          fi

          JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Services to deploy: $JSON"
          echo "services=$JSON" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Install Infisical CLI
        run: |
          set -euo pipefail

          curl -1sLf \
            'https://artifacts-cli.infisical.com/setup.deb.sh' \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y infisical

          infisical --version

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is empty; refusing to trust unknown host keys"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          ansible-playbook \
            -i ansible/inventories/hosts.yml \
            ansible/playbooks/deploy-docker.yml \
            -e "target_host=${SERVICE%%/*}" \
            -e "service=$SERVICE"
