name: Deploy Docker Services

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service:
        description: "Docker service folder to deploy"
        required: true
        type: string

env:
  VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh xcraftman52@$VPS_HOST "hostname && whoami"

      - name: Deploy Docker service
        run: |
          ansible-playbook \
            -i ansible/inventories/hosts.yml \
            ansible/playbooks/deploy-docker.yml \
            -e service=${{ inputs.service || '' }}