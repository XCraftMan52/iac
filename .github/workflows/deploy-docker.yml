name: Deploy Docker Services

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service:
        description: "Docker service folder to deploy"
        required: false
        type: string

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}

jobs:
   detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changed
        run: |
          if [ -n "${{ inputs.service }}" ]; then
            echo "Manual deployment: ${{ inputs.service }}"
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVICES=$(git diff --name-only HEAD^ HEAD \
            | grep '^docker/' \
            | cut -d/ -f2,3 \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Changed services:"
          echo "$SERVICES"

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
   deploy:
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Install Infisical CLI
        run: |
          curl -1sLf \
            'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' \
            | sudo -E bash

          sudo apt-get install -y infisical
          infisical --version

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan "10.32.100.42" >> ~/.ssh/known_hosts

      - name: Test Infisical
        env:
          INFISICAL_API_URL: https://infisical.lucaswebber.dev
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent \
            --plain > /tmp/infisical_token

          echo "Infisical login succeeded"
          echo "Token length: $(wc -c < /tmp/infisical_token)"

          export INFISICAL_TOKEN="$(cat /tmp/infisical_token)"

          infisical export \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env=prod \
            --path=/vps/webberlights \
            --format=dotenv \
            > /tmp/test.env

          echo "Infisical export succeeded"
          echo "Number of variables: $(grep -c '=' /tmp/test.env)"
          rm -f /tmp/infisical_token /tmp/test.env
          
      - name: Deploy ${{ matrix.service }}
        run: |
          TARGET_HOST="${{ matrix.service }}"
          TARGET_HOST="${TARGET_HOST%%/*}"

          ansible-playbook \
            -i ansible/inventories/hosts.yml \
            ansible/playbooks/deploy-docker.yml \
            -e "target_host=$TARGET_HOST" \
            -e "service=${{ matrix.service }}" \
            -e "ghcr_username=${{ secrets.GHCR_USERNAME }}" \
            -e "ghcr_token=${{ secrets.GHCR_TOKEN }}" \
            -e "infisical_client_id=${{ secrets.INFISICAL_CLIENT_ID }}" \
            -e "infisical_client_secret=${{ secrets.INFISICAL_CLIENT_SECRET }}"